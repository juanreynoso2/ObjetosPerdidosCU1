# Objetos Perdidos CU1 · servicios de desarrollo
# Uso: copia .env.example a .env, cambia la contraseña y ejecuta `docker compose up -d --build`.

services:
  db:
    image: postgres:16-alpine
    container_name: opcu1-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-objetos_perdidos}
      POSTGRES_USER: ${POSTGRES_USER:-opcu1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      # Solo accesible desde tu computadora. Cambia DB_PORT en .env si el 15432 está ocupado o bloqueado.
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan en orden SOLO la primera vez (con la base vacía).
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/pruebas:/pruebas:ro
      - ./db/reportes:/reportes:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: opcu1-api
    restart: unless-stopped
    # En desarrollo se reinicia sola al guardar cambios en api/src.
    command: npm run dev
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-objetos_perdidos}
      PGUSER: ${POSTGRES_USER:-opcu1}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      PORT: 3000
      TZ: America/Mexico_City
      FRONTEND_DIR: /app/public
      # Clave para firmar las sesiones de administración (ver .env.example)
      JWT_SECRET: ${JWT_SECRET:-}
      # En producción con HTTPS: COOKIE_SECURE=true y, detrás de un proxy, TRUST_PROXY=1
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LIMITE_REPORTES_POR_MINUTO: ${LIMITE_REPORTES_POR_MINUTO:-10}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:3000"
    volumes:
      - ./api/src:/app/src:ro
      - ./api/test:/app/test:ro
      - ./frontend:/app/public:ro
      - ./api/scripts:/app/scripts:ro
      - ./db/datos_reales:/app/datos:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
